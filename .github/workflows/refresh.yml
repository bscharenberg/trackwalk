name: Refresh Trackwalk Cache

on:
  schedule:
    # Two attempts an hour, both off the top of the hour.
    #
    # This was '0 * * * *'. Measured 2026-09-16 over 122 hours: 29 runs, every one success, but
    # gaps of 2.2h-7.8h — GitHub fired only ~24% of the requested slots, so the feed refreshed
    # about every 4 hours rather than hourly. GitHub drops scheduled runs under load and ':00' is
    # the most contended minute on the platform, which is why the misses cluster there.
    #
    # Asking twice per hour at unpopular minutes raises the odds that at least one lands. Cost is
    # nil: the repo is public (unlimited Actions minutes) and a run spends ~30 YouTube quota units
    # (14 playlistItems + ~16 videos.list batches), so even if every slot fired it is ~1,440 of
    # the 10,000/day limit. build-cache.js no-ops the commit when nothing changed, so extra runs
    # cannot churn history.
    - cron: '13,43 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run cache build
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          PINKBIKE_PROXY: ${{ secrets.PINKBIKE_PROXY }}
        run: node scripts/build-cache.js

      - name: Commit updated cache
        run: |
          git config user.name "Trackwalk Bot"
          git config user.email "trackwalk-bot@users.noreply.github.com"

          git add public/cache.json

          if git diff --staged --quiet; then
            echo "No changes to cache.json — nothing to commit."
            exit 0
          fi

          git commit -m "chore: refresh cache $(date -u '+%Y-%m-%d %H:%M UTC')"

          # The results-fetcher workflow pushes to the same branch on race weekends, so a
          # push can race. Rebase-and-push with retries; different files means no conflict.
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && { echo "Pushed on attempt $attempt."; exit 0; }
            echo "Push attempt $attempt failed (likely a concurrent push) — retrying in 10s..."
            sleep 10
          done

          echo "::error::Failed to push cache after 5 attempts."
          exit 1
