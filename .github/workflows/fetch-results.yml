name: Fetch Race Results

on:
  workflow_dispatch:
    inputs:
      venue_slug:
        description: 'Venue slug (e.g. loudenvielle-2026)'
        required: true
        type: choice
        options:
          - race-of-south-korea-2026
          - loudenvielle-2026
          - leogang-2026
          - lenzerheide-2026
          - la-thuile-2026
          - pal-arinsal-2026
          - les-gets-2026
          - val-di-sole-2026
          - whistler-2026
          - lake-placid-2026

  schedule:
    # Poll every 10 min. The date check below gates on race days only — non-race-day
    # runs exit after the first step (no checkout, no npm ci), so idle cost is one shell command.
    - cron: '*/10 * * * *'

permissions:
  contents: write

jobs:
  fetch-results:
    runs-on: ubuntu-latest

    steps:
      - name: Determine venue slug
        id: venue
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "slug=${{ github.event.inputs.venue_slug }}" >> $GITHUB_OUTPUT
          else
            # Window = [finals date - 3 days, finals date + 1 day] for each round, not just
            # the assumed qual/finals pair. Learned the hard way: La Thuile's Q1/Q2 posted
            # 07-03, three days before finals (07-05), but the old case only matched
            # 07-04|07-05 — the 30-min poller had "slug=unknown" on 07-03 and silently did
            # nothing all day. The UCI's per-round qualifying schedule isn't perfectly
            # consistent round to round, so give every round a few days of leading buffer
            # (covers Q1/Q2 posting early) and one trailing day (covers a rain-delayed
            # finals). A day matching no window is a safe no-op (slug=unknown skips every
            # remaining step), so a wider window costs nothing on idle days.
            case "$(date -u +%m-%d)" in
              06-12|06-13) echo "slug=leogang-2026"      >> $GITHUB_OUTPUT ;;
              06-20|06-21) echo "slug=lenzerheide-2026"  >> $GITHUB_OUTPUT ;;
              07-0[2-6])   echo "slug=la-thuile-2026"    >> $GITHUB_OUTPUT ;;  # finals 07-05
              07-09|07-1[0-3])
                           echo "slug=pal-arinsal-2026"  >> $GITHUB_OUTPUT ;;  # finals 07-12
              08-2[0-4])   echo "slug=les-gets-2026"     >> $GITHUB_OUTPUT ;;  # finals 08-22
              08-2[7-9]|08-3[0-1])
                           echo "slug=val-di-sole-2026"  >> $GITHUB_OUTPUT ;;  # finals 08-29 (Worlds)
              09-2[3-9])   echo "slug=whistler-2026"     >> $GITHUB_OUTPUT ;;  # finals 09-27
              09-30|10-0[1-6])
                           echo "slug=lake-placid-2026"  >> $GITHUB_OUTPUT ;;  # finals 10-04
              *)            echo "slug=unknown"           >> $GITHUB_OUTPUT ;;
            esac
          fi

      # All remaining steps are skipped on non-race days (slug=unknown).
      # This keeps the 30-min polling cost to a single shell command on idle days.

      - name: Checkout repo
        if: steps.venue.outputs.slug != 'unknown'
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: steps.venue.outputs.slug != 'unknown'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        if: steps.venue.outputs.slug != 'unknown'
        run: npm ci

      - name: Fetch and parse results
        if: steps.venue.outputs.slug != 'unknown'
        env:
          DEBUG_RESULTS: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: node scripts/results-fetcher.mjs ${{ steps.venue.outputs.slug }}

      # World Championships. The UCI World Series API above does not carry them, and neither
      # does ChronoRace's WBD document (its 2026 event list goes straight from Les Gets to
      # Soldier Hollow). Tissot is the official UCI timekeeper and publishes Worlds live, so
      # this is the only same-day source for a Worlds round. Self-no-ops when there is
      # nothing new, so it does not churn a commit on every poll.
      - name: Fetch World Championships results (Tissot)
        if: steps.venue.outputs.slug != 'unknown'
        continue-on-error: true
        run: node scripts/tissot-fetcher.mjs "$(date -u +%Y)" --merge

      # World Series rounds. ucimtbworldseries.com (the step above) no longer serves an SPA shell
      # — since 2026-09-22 it returns valid JSON — but every round comes back empty (completed
      # rounds give results:null, unraced ones results:[]), so it is still not a usable source.
      # The old note said it served its SPA shell
      # instead of JSON since before Les Gets and has not recovered, so for Whistler and Lake
      # Placid this is the only same-day source — Tissot carries World Championships only, and
      # DataRide runs days behind. ChronoRace is the UCI's timing vendor, i.e. upstream of
      # both. Self-no-ops when nothing changed, and never deletes a value another source
      # supplied.
      - name: Fetch World Series results (ChronoRace)
        if: steps.venue.outputs.slug != 'unknown'
        continue-on-error: true
        run: node scripts/chronorace-fetcher.mjs "$(date -u +%Y)" --merge

      # results.json is the canonical artifact; public/results/ is what the app fetches.
      # Must run after every merge above, or the app serves last run's results.
      - name: Rebuild per-season result shards
        if: steps.venue.outputs.slug != 'unknown'
        run: node scripts/split-results.js

      - name: Commit updated results
        if: steps.venue.outputs.slug != 'unknown'
        run: |
          git config user.name "Trackwalk Bot"
          git config user.email "trackwalk-bot@users.noreply.github.com"

          git add public/results.json public/results/

          # Nothing changed (e.g. finals already committed on an earlier run) → done.
          if git diff --staged --quiet; then
            echo "No changes to results.json — nothing to commit."
            exit 0
          fi

          # Commit FIRST, then rebase. Because the change is now a real commit
          # (not a working-tree/staged change), git pull --rebase replays it cleanly
          # on top of remote HEAD — no stash, nothing silently unstaged.
          git commit -m "results: ${{ steps.venue.outputs.slug }} $(date -u '+%Y-%m-%d %H:%M UTC')"

          # The hourly cache-refresh workflow pushes to the same branch, so a push can
          # race. Rebase-and-push with retries; different files means rebase won't conflict.
          # Push back to whichever ref this ran on — NOT a hardcoded main. The scheduled run is
          # on main; a workflow_dispatch from a feature branch would otherwise rebase that
          # branch onto main and conflict on every file under checkout's shallow clone.
          BRANCH="${GITHUB_REF_NAME}"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin "$BRANCH" && git push origin "HEAD:$BRANCH" && { echo "Pushed to $BRANCH on attempt $attempt."; exit 0; }
            echo "Push attempt $attempt failed (likely a concurrent push) — retrying in 10s..."
            sleep 10
          done

          echo "::error::Failed to push results after 5 attempts."
          exit 1

