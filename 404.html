<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="robots" content="noindex">
<title>Off the track · Trackwalk</title>
<style>
  /* Self-contained on purpose: a 404 must render even when nothing else loads. Design tokens
     are duplicated from index.html rather than shared — there is no build step to share them. */
  :root { --acid:#d4f500; --bg:#111; --muted:#888; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; background:var(--bg); color:#fff;
    font-family:'Barlow Condensed','Helvetica Neue',Arial,sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:24px; gap:4px;
  }
  .code { font-size:13px; letter-spacing:0.18em; text-transform:uppercase; color:var(--acid); font-weight:700; }
  h1 { font-size:clamp(34px,11vw,60px); line-height:1; margin:10px 0 0; text-transform:uppercase; font-weight:700; letter-spacing:0.01em; }
  p { color:var(--muted); font-size:16px; max-width:34ch; margin:14px 0 26px; line-height:1.45; }
  a.btn {
    display:inline-block; background:var(--acid); color:#111; text-decoration:none;
    font-size:13px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase;
    padding:13px 26px; border-radius:6px;
  }
  img { width:150px; max-width:60%; height:auto; margin-bottom:18px; }
</style>
</head>
<body>
  <img src="/trackwalk-wordmark.png" alt="Trackwalk" onerror="this.style.display='none'">
  <div class="code">Error 404</div>
  <h1>Off the track</h1>
  <p>That line doesn't go anywhere. Let's get you back on course.</p>
  <a class="btn" href="/">Back to the feed</a>
</body>
</html>
