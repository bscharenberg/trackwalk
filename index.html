<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trackwalk</title>
<meta name="description" content="Trackwalk — the new name for Helltrack. UCI downhill race content and results. Full site launching soon.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #111;
    --accent: #d4f500;
    --text: #f2f2f2;
    --text-dim: #9a9a9a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Barlow Condensed', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    height: 100%;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    text-align: center;
  }
  .logo {
    width: clamp(84px, 20vw, 128px);
    height: auto;
    margin-bottom: 20px;
    border-radius: 22%;
  }
  .wordmark {
    font-weight: 900;
    font-size: clamp(3rem, 14vw, 7rem);
    letter-spacing: 0.02em;
    color: var(--accent);
    line-height: 0.95;
    margin: 0;
    text-transform: uppercase;
  }
  .tagline {
    font-weight: 600;
    font-size: clamp(1.1rem, 4vw, 1.6rem);
    color: var(--text);
    margin: 18px 0 0;
    max-width: 34rem;
    line-height: 1.25;
  }
  .tagline .old-name {
    color: var(--text-dim);
    text-decoration: none;
    border-bottom: 1px solid var(--text-dim);
  }
  .tagline .old-name:hover,
  .tagline .old-name:active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }
  .status {
    font-weight: 400;
    font-size: clamp(0.95rem, 3vw, 1.15rem);
    color: var(--text-dim);
    margin: 10px 0 0;
  }
  .divider {
    width: 48px;
    height: 3px;
    background: var(--accent);
    margin: 28px 0;
    border: none;
  }
  .link-back {
    display: inline-block;
    font-weight: 700;
    font-size: clamp(1rem, 3.5vw, 1.2rem);
    color: var(--bg);
    background: var(--accent);
    text-decoration: none;
    padding: 12px 28px;
    border-radius: 4px;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }
  .link-back:active { opacity: 0.85; }
  footer {
    position: fixed;
    bottom: 18px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 0.8rem;
    color: #555;
    letter-spacing: 0.02em;
  }
</style>
</head>
